<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>WORI Content Management Portal</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
      }
      :root {
        --primary-color: #C0392B;
        --accent-color: #D4A76A;
        --background-color: #FDF8F3;
        --text-color: #2D2D2D;
      }
      [class*="css"],
      .css-1a84c1p-MenuButtonButton,
      .css-rjv3sd-AddButton-button-button,
      .css-1io1vuu-PrimaryButton-Button-button-button-default-default-enabled-enabled,
      .css-fngg5z-PrimaryButton-Button-button-button-default-default-enabled-enabled,
      .css-1m1ktum-AddButton-button-button {
        background-color: #C0392B !important;
        color: #fff !important;
      }
      .css-1vyrqgv-ToolbarButton-button-button-default-default-enabled-enabled-active {
        background-color: #A93226 !important;
      }
      .css-2btsgj-SidebarContainerContainer, .css-1w2vgp6-SidebarContainerContainer {
        background-color: #F5EDE3 !important;
      }

      /* Loading state */
      #cms-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #C0392B;
        font-size: 18px;
        background: #FDF8F3;
      }
      #cms-loading .spinner {
        width: 24px;
        height: 24px;
        border: 3px solid #F5EDE3;
        border-top: 3px solid #C0392B;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 12px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <script>
      // Prevent auto-init — we'll load config manually to bypass all caching
      window.CMS_MANUAL_INIT = true;
    </script>
  </head>
  <body>
    <div id="cms-loading">
      <div class="spinner"></div>
      <span>Loading CMS...</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      (async function() {
        try {
          // Force fresh config fetch with cache busting
          const configUrl = '/admin/config.yml?v=' + Date.now();
          const response = await fetch(configUrl, { cache: 'no-store' });

          if (!response.ok) {
            throw new Error('Failed to load config: ' + response.status);
          }

          const yamlText = await response.text();
          const config = jsyaml.load(yamlText);

          // Register CMS and init
          const { CMS } = window;
          CMS.init({ config });

          // Remove loading indicator
          const loading = document.getElementById('cms-loading');
          if (loading) loading.remove();
        } catch (err) {
          const loading = document.getElementById('cms-loading');
          if (loading) {
            loading.innerHTML = '<span style="color:#C0392B;">Failed to load CMS config. Please try refreshing the page (Ctrl+Shift+R).</span>';
          }
          console.error('CMS init error:', err);
        }
      })();
    </script>
  </body>
</html>
