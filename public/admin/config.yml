      - { label: "Biography (French)", name: "bio_fr", widget: "markdown", required: false }
      - { label: "Biography (Arabic)", name: "bio_ar", widget: "markdown", required: false }
      - { label: "Order Priority", name: "order", widget: "number", default: 1, value_type: "int" }

  # ── 4. CRISIS ALERTS ──
  - name: "alerts"
    label: "Crisis Alerts & Banners"
    folder: "public/content/alerts"
    create: true
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Alert Title (English)", name: "title_en", widget: "string" }
      - { label: "Alert Title (French)", name: "title_fr", widget: "string", required: false }
      - { label: "Alert Title (Arabic)", name: "title_ar", widget: "string", required: false }
      - { label: "Active Banner", name: "active", widget: "boolean", default: false }
      - { label: "Banner Message (English)", name: "body_en", widget: "markdown" }
      - { label: "Banner Message (French)", name: "body_fr", widget: "markdown", required: false }
      - { label: "Banner Message (Arabic)", name: "body_ar", widget: "markdown", required: false }
      - { label: "Action Button Text", name: "buttonText", widget: "string", required: false }
      - { label: "Action Button Link", name: "buttonLink", widget: "string", required: false }