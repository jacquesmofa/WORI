  # ── 2. NEWS & EVENTS ──
  - name: "news"
    label: "News & Events"
    folder: "public/content/news"
    create: true
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - { label: "Title (French)", name: "title_fr", widget: "string", required: false }
      - { label: "Title (Arabic)", name: "title_ar", widget: "string", required: false }
