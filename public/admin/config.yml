        label: "Site Content Database"
        name: "site_content"
        format: "json"
        fields:
          # ── ENGLISH ──
          - label: "English Content"
            name: "en"
            widget: "object"
            fields:
              - label: "Hero Section"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Badge", name: "badge", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string", required: false }
                  - { label: "Subtitle", name: "subtitle", widget: "text", required: false }
                  - { label: "Image URL", name: "image", widget: "string", required: false }
                  - { label: "CTA Primary", name: "ctaPrimary", widget: "string", required: false }
                  - { label: "CTA Secondary", name: "ctaSecondary", widget: "string", required: false }
              - label: "Vision"
