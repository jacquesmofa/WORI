backend:
  name: github
  repo: jacquesmofa/WORI
  branch: main

media_folder: "public/images"
public_folder: "/images"

media_library:
  name: cloudinary
  config:
    cloud_name: oqdvximy
    api_key: "628222561339787"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

